steps:
  # 1. Install dependencies and run linting/testing
  - name: 'node:22'
    entrypoint: 'npm'
    args: ['ci']

  - name: 'node:22'
    entrypoint: 'npm'
    args: ['run', 'lint']

  # 2. Build the production application
  - name: 'node:22'
    entrypoint: 'npm'
    args: ['run', 'build']

  # 3. Build Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/photoshare/app:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/photoshare/app:latest'
      - '.'

  # 4. Push Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/photoshare/app:$COMMIT_SHA'

  # 5. Deploy container to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'photoshare-app'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/photoshare/app:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/photoshare/app:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/photoshare/app:latest'
